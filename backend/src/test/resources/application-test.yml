spring:
  datasource:
    url: jdbc:h2:mem:smartplanner;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

smartplanner:
  seed:
    enabled: false
  engine:
    base-url: http://127.0.0.1:9
